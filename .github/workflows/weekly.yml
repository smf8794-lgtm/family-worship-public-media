name: Collect public media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/weekly.yml']
  schedule:
    - cron: '30 19 * * 6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-catalog-publication
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read current state branch
        run: |
          git fetch --depth=1 origin refs/heads/catalog-state
          git worktree add --detach "$RUNNER_TEMP/catalog" FETCH_HEAD
      - name: Verify and collect
        run: |
          python3 collector/test.py
          python3 collector/build.py "$RUNNER_TEMP/catalog/archive.json" "$RUNNER_TEMP/catalog/archive.next"
          node verify-publication.mjs "$RUNNER_TEMP/catalog/archive.next"
          mv "$RUNNER_TEMP/catalog/archive.next" "$RUNNER_TEMP/catalog/archive.json"
      - name: Publish one JSON file by fast-forward
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/catalog"
          git config user.name catalog-publisher
          git config user.email catalog@users.noreply.github.com
          git add -- archive.json
          git commit -m 'Update public weekly archive'
          auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/catalog-state
